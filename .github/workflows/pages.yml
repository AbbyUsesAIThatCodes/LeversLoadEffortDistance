name: Deploy Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Test and Build
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check Out the Repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set Up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - name: Install Dependencies
        run: npm ci
      - name: Check the Lever Model and Geometry
        run: npm test
      - name: Build the Game
        id: game
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run build
      - name: Check Build Identity
        run: node scripts/verify-build.mjs
      - name: Install the Review Browser
        run: npx playwright install --with-deps chromium
      - name: Check Pointer Motion and Appearance
        run: node tests/weighted-pointer-browser.mjs
      - name: Include Review Evidence
        env:
          BUILD_PATH: ${{ steps.game.outputs.build_path }}
        run: cp -R artifacts/weighted-pointer "$BUILD_PATH/review"
      - name: Upload the Review Build
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.game.outputs.build_id }}
          path: ${{ steps.game.outputs.build_path }}
          retention-days: 14
      - name: Upload the Built Site
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: dist

  deploy:
    name: Publish to GitHub Pages
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Deploy the Site
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
